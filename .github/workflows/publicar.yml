name: Publicar sitio

# Corre con cada cambio en main: cuando alguien guarda desde /admin,
# sube una planilla a importar/ o edita archivos a mano.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install openpyxl==3.1.5 pillow==11.0.0

      - name: Importar planillas de importar/
        run: python scripts/importar.py

      - name: Guardar en el repositorio lo importado
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "VoCor (importación automática)"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A content imagenes importar
            git commit -m "Importar planilla desde importar/"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Armar el sitio
        run: python scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
